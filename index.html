<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Door scanner</title>
<style>
  :root{--bg:#0f131b;--card:#181e2a;--line:#2a3243;--fg:#f2f4f8;--mut:#98a2b6;--ok:#1f9d55;--warn:#d98a00;--bad:#c93a3a;--accent:#4c8dff}
  *{box-sizing:border-box}
  [hidden]{display:none!important}
  html,body{margin:0;min-height:100%}
  body{background:var(--bg);color:var(--fg);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    padding:max(16px,env(safe-area-inset-top)) 16px max(16px,env(safe-area-inset-bottom))}
  .wrap{max-width:520px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
  h1{font-size:22px;margin:8px 0 0}
  p.lead{margin:0;color:var(--mut)}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px}
  label{display:block;color:var(--mut);font-size:14px;margin-bottom:6px}
  .field{margin-bottom:14px}
  input{width:100%;padding:13px 14px;border-radius:10px;border:1px solid var(--line);background:#0f131b;color:var(--fg);font:inherit}
  input::placeholder{color:#6b7488}
  button{padding:13px 18px;border:0;border-radius:10px;font:inherit;font-weight:600;cursor:pointer;background:var(--line);color:var(--fg)}
  button.primary{background:var(--accent);color:#fff;width:100%}
  button:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
  .bar{display:flex;align-items:center;justify-content:space-between;gap:12px}
  #count{font-size:18px;font-weight:700}
  .frame{position:relative;border-radius:14px;overflow:hidden;background:#000;border:1px solid var(--line);aspect-ratio:1/1;max-height:52vh;margin:0 auto;width:100%}
  #reader{width:100%;height:100%}
  #reader video{width:100%!important;height:100%!important;object-fit:cover}
  #reader img{display:none}
  #cam{margin:0;color:var(--mut);font-size:14px;text-align:center;min-height:20px}
  #status{border-radius:14px;padding:22px 16px;text-align:center;background:var(--card);border:1px solid var(--line);transition:background .15s}
  #status.ok{background:var(--ok);border-color:var(--ok)}
  #status.already{background:var(--warn);border-color:var(--warn)}
  #status.invalid,#status.denied,#status.error{background:var(--bad);border-color:var(--bad)}
  #big{font-size:34px;font-weight:800;margin:0}
  #sub{font-size:18px;margin:6px 0 0;color:#e6e9f0;overflow-wrap:anywhere}
  form{display:flex;gap:8px}
  form input{flex:1;min-width:0}
  @media (min-width:700px){body{padding-top:32px}.frame{max-height:420px}}
</style></head>
<body>
<div class="wrap">

  <section id="setup" hidden>
    <h1>Connect the scanner</h1>
    <p class="lead">Enter these once. They are saved on this device.</p>
    <div class="card">
      <div class="field"><label for="url">Web app URL</label>
        <input id="url" type="url" inputmode="url" autocapitalize="off" autocomplete="off" placeholder="https://script.google.com/macros/s/…/exec"></div>
      <div class="field"><label for="key">Staff key</label>
        <input id="key" autocapitalize="off" autocomplete="off" placeholder="From the Settings sheet"></div>
      <div class="field"><label for="by">Your name</label>
        <input id="by" autocomplete="off" placeholder="Shown next to each check-in"></div>
      <button class="primary" id="save">Start scanning</button>
    </div>
  </section>

  <section id="app" hidden>
    <div class="bar"><strong id="count">Loading…</strong><button id="reset">Settings</button></div>
    <div class="frame"><div id="reader"></div></div>
    <p id="cam"></p>
    <div id="status"><p id="big">Ready</p><p id="sub">Point the camera at a ticket</p></div>
    <form id="manual">
      <input id="code" placeholder="Or type the ticket code" autocomplete="off" autocapitalize="off">
      <button type="submit">Check</button>
    </form>
  </section>

</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html5-qrcode/2.3.8/html5-qrcode.min.js"></script>
<script>
var cfg = {};
try { cfg = JSON.parse(localStorage.getItem('cfg') || '{}'); } catch (e) {}
var $ = function (id) { return document.getElementById(id); };
var busy = false, scanner = null;

function show() {
  var ready = cfg.url && cfg.key;
  $('setup').hidden = !!ready;
  $('app').hidden = !ready;
  if (ready) { start(); stats(); }
  else { $('url').value = cfg.url || ''; $('key').value = cfg.key || ''; $('by').value = cfg.by || ''; }
}
$('save').onclick = function () {
  cfg = { url: $('url').value.trim(), key: $('key').value.trim(), by: $('by').value.trim() };
  try { localStorage.setItem('cfg', JSON.stringify(cfg)); } catch (e) {}
  show();
};
$('reset').onclick = function () {
  var keep = cfg;
  try { localStorage.setItem('cfg', JSON.stringify({ url: keep.url, by: keep.by })); } catch (e) {}
  location.reload();
};
function call(params) {
  var q = Object.keys(params).map(function (k) { return k + '=' + encodeURIComponent(params[k]); }).join('&');
  return fetch(cfg.url + '?key=' + encodeURIComponent(cfg.key) + '&' + q).then(function (r) { return r.json(); });
}
function stats() {
  call({ action: 'stats' }).then(function (s) {
    $('count').textContent = s.result === 'denied' ? 'Wrong staff key' : s.checkedIn + ' in · ' + s.remaining + ' to go';
  }).catch(function () { $('count').textContent = 'Offline'; });
}
function setStatus(cls, big, sub) {
  $('status').className = cls; $('big').textContent = big; $('sub').textContent = sub;
}
function result(r) {
  var who = [r.name, r.designation, r.organization].filter(Boolean).join(', ');
  var map = {
    ok: ['Welcome', who],
    already: ['Already used', (r.name || '') + ' came in at ' + (r.checkedInAt || '')],
    invalid: ['Not a valid ticket', 'Check the code and try again'],
    denied: ['Wrong staff key', 'Tap Settings and enter it again'],
    error: ['No connection', 'Check the internet and try again']
  };
  var m = map[r.result] || map.error;
  setStatus(map[r.result] ? r.result : 'error', m[0], m[1]);
  if (navigator.vibrate) navigator.vibrate(r.result === 'ok' ? 80 : [120, 80, 120]);
  setTimeout(function () { setStatus('', 'Ready', 'Point the camera at a ticket'); busy = false; }, 2500);
  stats();
}
function check(token) {
  if (busy || !token) return;
  busy = true;
  call({ action: 'scan', token: token, by: cfg.by || '' }).then(result).catch(function () { result({ result: 'error' }); });
}
function start() {
  if (scanner) return;
  scanner = new Html5Qrcode('reader');
  var box = function (w, h) { var s = Math.floor(Math.min(w, h) * 0.7); return { width: s, height: s }; };
  scanner.start({ facingMode: 'environment' }, { fps: 10, qrbox: box, aspectRatio: 1 }, check, function () {})
    .catch(function () { $('cam').textContent = 'Camera is blocked. Allow camera access in the browser, or type the code below.'; });
}
$('manual').onsubmit = function (e) { e.preventDefault(); check($('code').value.trim()); $('code').value = ''; };
show();
</script>
</body></html>
